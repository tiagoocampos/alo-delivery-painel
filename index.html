<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="256x256" href="/favicon-256x256.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1769e0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Alô Painel" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel do Lojista — Alô Delivery</title>
    <script>
      // Aplica o modo escuro antes do app carregar, para a tela não piscar branco.
      // Mesma chave e mesmas cores do src/contexts/ThemeContext.tsx.
      (function () {
        var tema = "system"
        try {
          tema = localStorage.getItem("painel-tema") || "system"
        } catch (e) {}
        try {
          var escuro = tema === "dark" || (tema === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches)
          if (escuro) {
            document.documentElement.classList.add("dark")
            document.querySelector('meta[name="theme-color"]').setAttribute("content", "#0c1422")
          }
        } catch (e) {}
      })()
    </script>
    <style>
      /* Fundo escuro já no primeiro quadro, antes do CSS do app chegar. */
      html.dark { background-color: #0c1422; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
